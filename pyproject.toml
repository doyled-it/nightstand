[project]
name = "nightstand"
version = "0.1.0"
description = "Bedside e-ink picture frame for the Pimoroni Inky Impression 7.3 inch Spectra 6."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pillow>=10.0",
]

[project.optional-dependencies]
# The Pi-only driver. Pin to the inky release line that supports the 7.3 inch
# Spectra 6 panel (E673); confirm the exact version at install time on the Pi.
pi = [
    "inky>=2.1",
]

[project.scripts]
nightstand = "nightstand.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nightstand"]

[tool.hatch.build.targets.wheel.force-include]
"src/nightstand/fonts" = "nightstand/fonts"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
