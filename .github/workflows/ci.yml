name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check

      - name: Shellcheck deploy scripts
        # shellcheck is preinstalled on the GitHub-hosted ubuntu runners.
        run: shellcheck deploy/*.sh

      - name: Test
        run: uv run pytest
